name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          check-latest: true

      - name: Check the tag matches the version in the code
        run: |
          tag="${GITHUB_REF_NAME#v}"
          code="$(grep -oP 'var Version = "\K[^"]+' internal/cli/cli.go)"
          if [ "$tag" != "$code" ]; then
            echo "Tag v$tag does not match Version = \"$code\" in internal/cli/cli.go"; exit 1
          fi

      - name: go test
        run: |
          set -o pipefail
          go test -count=1 -json ./... 2>&1 | go run .github/ci/annotate.go

      - name: Build binaries
        env:
          CGO_ENABLED: '0'
        run: |
          set -e
          mkdir -p dist
          v="${GITHUB_REF_NAME}"
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os="${target%/*}"; arch="${target#*/}"
            name="sm-go_${v}_${os}_${arch}"
            ext=""; [ "$os" = windows ] && ext=".exe"
            mkdir -p "build/$name"
            GOOS=$os GOARCH=$arch go build -trimpath -ldflags="-s -w" -o "build/$name/sm-go$ext" ./cmd/sm-go
            cp LICENSE README.md "build/$name/"
            if [ "$os" = windows ]; then
              (cd build && zip -qr "../dist/$name.zip" "$name")
            else
              tar -C build -czf "dist/$name.tar.gz" "$name"
            fi
          done
          (cd dist && sha256sum * > checksums.txt)

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes --verify-tag

      - name: Ask the Go module proxy and pkg.go.dev to index the release
        run: |
          curl -fsS "https://proxy.golang.org/github.com/slash-mark-dev/go-suite/@v/${GITHUB_REF_NAME}.info"
          echo
          curl -fsS -X POST "https://pkg.go.dev/fetch/github.com/slash-mark-dev/go-suite@${GITHUB_REF_NAME}" || true
